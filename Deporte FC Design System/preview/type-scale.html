<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 16px 20px; background: var(--surface-base); }
.row { display: flex; align-items: baseline; gap: 16px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.meta { font-family: var(--font-mono); font-size: 9px; color: var(--text-muted); width: 80px; flex-shrink: 0; }
.sample { color: var(--text-primary); }
</style>
</head><body>
<div class="row"><div class="meta">48px / black</div><div class="sample" style="font-size:48px;font-weight:900;letter-spacing:-0.04em;line-height:1">96</div></div>
<div class="row"><div class="meta">36px / bold</div><div class="sample" style="font-size:36px;font-weight:700;letter-spacing:-0.03em;line-height:1">Dashboard</div></div>
<div class="row"><div class="meta">24px / bold</div><div class="sample" style="font-size:24px;font-weight:700;letter-spacing:-0.025em">Jugadores</div></div>
<div class="row"><div class="meta">20px / semibold</div><div class="sample" style="font-size:20px;font-weight:600;letter-spacing:-0.02em">Análisis de Riesgo</div></div>
<div class="row"><div class="meta">16px / medium</div><div class="sample" style="font-size:16px;font-weight:500">Estado del equipo</div></div>
<div class="row"><div class="meta">14px / regular</div><div class="sample" style="font-size:14px;color:var(--text-secondary)">Resumen de jugadores activos en el plantel</div></div>
<div class="row"><div class="meta">13px / regular</div><div class="sample" style="font-size:13px;color:var(--text-secondary)">Descripción secundaria de módulo</div></div>
<div class="row"><div class="meta">11px / bold caps</div><div class="sample" style="font-size:9px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-muted)">ANALYTICS</div></div>
</body></html>
