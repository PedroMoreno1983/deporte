<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 16px; background: var(--surface-base); display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
.swatch { display: flex; flex-direction: column; gap: 4px; }
.color-box { width: 80px; height: 56px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.10); }
.name { font-family: var(--font-mono); font-size: 9px; color: var(--text-muted); }
.hex  { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); font-weight: 600; }
</style>
</head><body>
<div class="swatch"><div class="color-box" style="background:#00ff87;box-shadow:0 0 18px rgba(0,255,135,0.5)"></div><div class="name">neon</div><div class="hex">#00ff87</div></div>
<div class="swatch"><div class="color-box" style="background:#00cc6a"></div><div class="name">neon-dim</div><div class="hex">#00cc6a</div></div>
<div class="swatch"><div class="color-box" style="background:#00994f"></div><div class="name">neon-dark</div><div class="hex">#00994f</div></div>
<div class="swatch"><div class="color-box" style="background:#0ea5e9;box-shadow:0 0 18px rgba(14,165,233,0.4)"></div><div class="name">sky</div><div class="hex">#0ea5e9</div></div>
<div class="swatch"><div class="color-box" style="background:#ff3b30;box-shadow:0 0 18px rgba(255,59,48,0.4)"></div><div class="name">danger</div><div class="hex">#ff3b30</div></div>
<div class="swatch"><div class="color-box" style="background:#f59e0b;box-shadow:0 0 18px rgba(245,158,11,0.4)"></div><div class="name">warning</div><div class="hex">#f59e0b</div></div>
<div class="swatch"><div class="color-box" style="background:#f97316"></div><div class="name">high-risk</div><div class="hex">#f97316</div></div>
<div class="swatch"><div class="color-box" style="background:#a855f7;box-shadow:0 0 18px rgba(168,85,247,0.3)"></div><div class="name">purple</div><div class="hex">#a855f7</div></div>
</body></html>
