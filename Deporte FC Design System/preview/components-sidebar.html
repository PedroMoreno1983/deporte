<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 0; background: var(--surface-base); display: flex; }
.sidebar {
  width: 220px; height: 400px; background: var(--surface-1);
  border-right: 1px solid rgba(255,255,255,0.08);
  box-shadow: 4px 0 40px rgba(0,0,0,0.7);
  display: flex; flex-direction: column; position: relative; overflow: hidden;
}
.neon-top { position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(0,255,135,0.6), transparent); }
.logo-area { display: flex; align-items: center; gap: 10px; padding: 16px 14px; border-bottom: 1px solid rgba(255,255,255,0.07); }
.logo-icon { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg,rgba(0,255,135,0.2),rgba(0,255,135,0.08)); border: 1px solid rgba(0,255,135,0.4); box-shadow: 0 0 16px rgba(0,255,135,0.3); display: flex; align-items: center; justify-content: center; }
.logo-text { font-size: 14px; font-weight: 900; letter-spacing: -0.02em; }
.logo-sub { font-size: 8px; font-weight: 600; letter-spacing: 0.15em; color: rgba(0,255,135,0.55); text-transform: uppercase; }
.nav { flex: 1; padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; }
.group-label { font-size: 9px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(100,116,139,0.8); padding: 6px 8px 4px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.4); cursor: pointer; }
.nav-item.active { background: #00ff87; color: #000; font-weight: 700; box-shadow: 0 0 24px rgba(0,255,135,0.55), 0 0 60px rgba(0,255,135,0.18); }
.nav-item:not(.active):hover { color: rgba(255,255,255,0.8); background: rgba(255,255,255,0.05); }
.nav-icon { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.7; }
.nav-item.active .nav-icon { opacity: 1; }
.divider { height: 1px; background: rgba(255,255,255,0.07); margin: 6px 8px; }
.user-card { margin: 8px; padding: 10px; border-radius: 10px; background: rgba(255,255,255,0.03); display: flex; align-items: center; gap: 10px; border-top: 1px solid rgba(255,255,255,0.07); margin-top: 0; }
.user-avatar { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg,rgba(0,255,135,0.2),rgba(0,255,135,0.08)); border: 1px solid rgba(0,255,135,0.35); color: #00ff87; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 12px; font-weight: 900; }
.user-name { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.85); }
.user-role { font-size: 9px; font-weight: 600; color: rgba(0,255,135,0.75); }

svg.icon { width: 16px; height: 16px; }
</style>
</head><body>
<div class="sidebar">
  <div class="neon-top"></div>
  <div class="logo-area">
    <div class="logo-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00ff87" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </div>
    <div><div class="logo-text"><span style="color:#fff">DEPORTE</span><span style="color:#00ff87"> FC</span></div><div class="logo-sub">Sports Platform</div></div>
  </div>
  <div class="nav">
    <div class="group-label">General</div>
    <div class="nav-item active">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Dashboard
    </div>
    <div class="nav-item">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Jugadores
    </div>
    <div class="nav-item">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      Lesiones
    </div>
    <div class="nav-item">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>
      Partidos
    </div>
    <div class="divider"></div>
    <div class="group-label">Analytics</div>
    <div class="nav-item">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      Analytics
    </div>
    <div class="nav-item">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
      Predicciones
    </div>
  </div>
  <div style="padding: 0 8px 8px;">
    <div class="user-card" style="border-top:none;margin:0">
      <div class="user-avatar">EC</div>
      <div><div class="user-name">Entrenador Carlos</div><div class="user-role">Entrenador</div></div>
    </div>
  </div>
</div>
</body></html>
