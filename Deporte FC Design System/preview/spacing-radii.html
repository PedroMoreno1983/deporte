<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 16px; background: var(--surface-base); display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
.group { display: flex; flex-direction: column; gap: 10px; }
.title { font-family: var(--font-mono); font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 4px; }
.radius-row { display: flex; align-items: center; gap: 10px; }
.box { background: var(--surface-3); border: 1px solid var(--border-medium); width: 48px; height: 36px; }
.meta { font-family: var(--font-mono); font-size: 9px; color: var(--text-muted); }
.space-row { display: flex; align-items: center; gap: 10px; }
.space-block { background: rgba(0,255,135,0.18); border: 1px solid rgba(0,255,135,0.3); height: 12px; }
</style>
</head><body>
<div class="group">
  <div class="title">Border Radius</div>
  <div class="radius-row"><div class="box" style="border-radius:6px"></div><div class="meta">sm — 6px</div></div>
  <div class="radius-row"><div class="box" style="border-radius:8px"></div><div class="meta">md — 8px</div></div>
  <div class="radius-row"><div class="box" style="border-radius:12px"></div><div class="meta">lg — 12px ← standard</div></div>
  <div class="radius-row"><div class="box" style="border-radius:16px"></div><div class="meta">xl — 16px ← player card</div></div>
  <div class="radius-row"><div class="box" style="border-radius:24px"></div><div class="meta">2xl — 24px</div></div>
  <div class="radius-row"><div class="box" style="border-radius:999px"></div><div class="meta">full — pill</div></div>
</div>
<div class="group">
  <div class="title">Spacing Scale</div>
  <div class="space-row"><div class="space-block" style="width:4px"></div><div class="meta">4px</div></div>
  <div class="space-row"><div class="space-block" style="width:8px"></div><div class="meta">8px</div></div>
  <div class="space-row"><div class="space-block" style="width:12px"></div><div class="meta">12px</div></div>
  <div class="space-row"><div class="space-block" style="width:16px"></div><div class="meta">16px</div></div>
  <div class="space-row"><div class="space-block" style="width:24px"></div><div class="meta">24px</div></div>
  <div class="space-row"><div class="space-block" style="width:32px"></div><div class="meta">32px</div></div>
  <div class="space-row"><div class="space-block" style="width:48px"></div><div class="meta">48px</div></div>
</div>
</body></html>
