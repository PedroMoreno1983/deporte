<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 24px; background: var(--surface-base); display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.item { display: flex; flex-direction: column; gap: 8px; }
.box { width: 96px; height: 56px; border-radius: 12px; background: var(--surface-2); border: 1px solid rgba(255,255,255,0.08); }
.meta { font-family: var(--font-mono); font-size: 9px; color: var(--text-muted); }
</style>
</head><body>
<div class="item"><div class="box" style="box-shadow:0 4px 24px rgba(0,0,0,0.45),0 1px 0 rgba(255,255,255,0.04)"></div><div class="meta">shadow-card</div></div>
<div class="item"><div class="box" style="box-shadow:0 8px 40px rgba(0,0,0,0.5),0 0 0 1px rgba(0,255,135,0.15),0 0 20px rgba(0,255,135,0.08);border-color:rgba(0,255,135,0.28)"></div><div class="meta">card-hover</div></div>
<div class="item"><div class="box" style="box-shadow:0 0 20px rgba(0,255,135,0.25),0 0 60px rgba(0,255,135,0.08);border-color:rgba(0,255,135,0.3)"></div><div class="meta">glow-green</div></div>
<div class="item"><div class="box" style="box-shadow:0 0 20px rgba(14,165,233,0.25);border-color:rgba(14,165,233,0.3)"></div><div class="meta">glow-blue</div></div>
<div class="item"><div class="box" style="box-shadow:0 0 20px rgba(255,59,48,0.35);border-color:rgba(255,59,48,0.3)"></div><div class="meta">glow-red</div></div>
<div class="item"><div class="box" style="box-shadow:0 0 20px rgba(245,158,11,0.25);border-color:rgba(245,158,11,0.3)"></div><div class="meta">glow-amber</div></div>
<div class="item"><div class="box" style="background:#00ff87;color:#000;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;box-shadow:0 0 24px rgba(0,255,135,0.55),0 0 60px rgba(0,255,135,0.18),0 2px 8px rgba(0,0,0,0.4)">ACTIVO</div><div class="meta">nav-active glow</div></div>
