<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 20px; background: var(--surface-base); display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.group { display: flex; flex-direction: column; gap: 6px; }
.tag { font-size: 9px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; border-radius: 10px; font-size: 13px; font-weight: 600; font-family: var(--font-sans); cursor: pointer; border: none; transition: all 0.2s; }
.btn-primary { background: #00ff87; color: #000; box-shadow: 0 0 20px rgba(0,255,135,0.3); }
.btn-primary:hover { box-shadow: 0 0 30px rgba(0,255,135,0.5); transform: translateY(-1px); }
.btn-secondary { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.85); border: 1px solid rgba(255,255,255,0.12); }
.btn-secondary:hover { background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.2); }
.btn-danger { background: rgba(255,59,48,0.12); color: #ff3b30; border: 1px solid rgba(255,59,48,0.3); }
.btn-danger:hover { background: rgba(255,59,48,0.20); box-shadow: 0 0 16px rgba(255,59,48,0.2); }
.btn-ghost { background: transparent; color: rgba(255,255,255,0.5); padding: 9px 14px; }
.btn-ghost:hover { color: rgba(255,255,255,0.85); background: rgba(255,255,255,0.05); }
.btn-sm { padding: 6px 12px; font-size: 11px; border-radius: 8px; }
.input-wrap { display: flex; flex-direction: column; gap: 4px; }
.input { background: var(--surface-3); border: 1px solid rgba(255,255,255,0.10); border-radius: 10px; padding: 9px 13px; font-size: 13px; color: var(--text-primary); font-family: var(--font-sans); outline: none; width: 200px; transition: border-color 0.2s, box-shadow 0.2s; }
.input:focus { border-color: rgba(0,255,135,0.4); box-shadow: 0 0 0 3px rgba(0,255,135,0.10); }
.input::placeholder { color: var(--text-muted); }
</style>
</head><body>
<div class="group">
  <div class="tag">Primary</div>
  <button class="btn btn-primary">Guardar cambios</button>
  <button class="btn btn-primary btn-sm">Nuevo jugador</button>
</div>
<div class="group">
  <div class="tag">Secondary / Ghost</div>
  <button class="btn btn-secondary">Exportar PDF</button>
  <button class="btn btn-ghost">Cancelar</button>
</div>
<div class="group">
  <div class="tag">Danger</div>
  <button class="btn btn-danger">Eliminar</button>
</div>
<div class="group">
  <div class="tag">Input</div>
  <div class="input-wrap">
    <input class="input" placeholder="Buscar jugadores…" />
    <input class="input" value="Carlos Andrés" />
  </div>
</div>
</body></html>
