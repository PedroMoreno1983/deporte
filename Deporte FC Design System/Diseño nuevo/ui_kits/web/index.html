function Badge({children, color="#10b981", size="sm"}) {
  const p = size==="sm" ? "2px 8px" : "4px 12px";
  const fs = size==="sm" ? 9 : 11;
  return (
    <span style={{display:"inline-flex",alignItems:"center",fontSize:fs,fontWeight:700,padding:p,borderRadius:999,
      color,background:`${color}1f`,border:`1px solid ${color}40`,letterSpacing:"0.04em",whiteSpace:"nowrap",lineHeight:1.4}}>
      {children}
    </span>
  );
}

function Btn({children,variant="primary",size="md",onClick,style:s}) {
  const base = {display:"inline-flex",alignItems:"center",gap:6,fontFamily:"var(--font)",fontWeight:600,borderRadius:10,cursor:"pointer",border:"1px solid transparent",transition:"all 0.15s",whiteSpace:"nowrap"};
  const sizes = {sm:{fontSize:11,padding:"5px 12px"},md:{fontSize:13,padding:"8px 16px"},lg:{fontSize:14,padding:"10px 20px"}};
  const variants = {
    primary:{background:"linear-gradient(180deg, #10b981 0%, #059669 100%)",color:"#fff",boxShadow:"0 1px 0 rgba(255,255,255,0.15) inset, 0 1px 2px rgba(0,0,0,0.3)",borderColor:"transparent"},
    secondary:{background:"rgba(255,255,255,0.05)",color:"rgba(255,255,255,0.85)",borderColor:"rgba(255,255,255,0.12)"},
    ghost:{background:"transparent",color:"rgba(255,255,255,0.5)",borderColor:"transparent"},
    danger:{background:"rgba(244,63,94,0.1)",color:"#f43f5e",borderColor:"rgba(244,63,94,0.25)"},
  };
  return (
    <button style={{...base,...sizes[size],...variants[variant],...s}} onClick={onClick}
      onMouseEnter={e=>{
        if(variant==="primary"){e.currentTarget.style.boxShadow="0 2px 12px rgba(16,185,129,0.25)";e.currentTarget.style.transform="translateY(-1px)";}
        if(variant==="secondary"){e.currentTarget.style.background="rgba(255,255,255,0.09)";e.currentTarget.style.borderColor="rgba(255,255,255,0.2)";}
        if(variant==="ghost"){e.currentTarget.style.background="rgba(255,255,255,0.05)";e.currentTarget.style.color="rgba(255,255,255,0.85)";}
        if(variant==="danger"){e.currentTarget.style.background="rgba(244,63,94,0.18)";}
      }}
      onMouseLeave={e=>{
        if(variant==="primary"){e.currentTarget.style.boxShadow="0 0 20px rgba(16,185,129,0.25)";e.currentTarget.style.transform="";}
        if(variant==="secondary"){e.currentTarget.style.background="rgba(255,255,255,0.05)";e.currentTarget.style.borderColor="rgba(255,255,255,0.12)";}
        if(variant==="ghost"){e.currentTarget.style.background="transparent";e.currentTarget.style.color="rgba(255,255,255,0.5)";}
        if(variant==="danger"){e.currentTarget.style.background="rgba(244,63,94,0.1)";}
      }}>
      {children}
    </button>
  );
}

function Card({children, style:s, hover=true, glow=false}) {
  const ref = React.useRef(null);
  const base = {background:"linear-gradient(180deg, rgba(21,28,44,0.85) 0%, rgba(15,21,33,0.85) 100%)",border:"1px solid var(--b1)",borderRadius:10,boxShadow:"0 1px 0 rgba(255,255,255,0.04) inset, 0 1px 2px rgba(0,0,0,0.3)",overflow:"hidden",transition:"border-color 0.2s,box-shadow 0.2s",...s};
  if (!hover && !glow) return <div style={base}>{children}</div>;
  const onMove = e => {
    if (!ref.current || !glow) return;
    const r = ref.current.getBoundingClientRect();
    ref.current.style.setProperty("--mx",`${((e.clientX-r.left)/r.width)*100}%`);
    ref.current.style.setProperty("--my",`${((e.clientY-r.top)/r.height)*100}%`);
    ref.current.querySelector(".sp").style.opacity=1;
  };
  const onLeave = e => {
    if(!ref.current) return;
    if(glow) ref.current.querySelector(".sp").style.opacity=0;
    if(hover){e.currentTarget.style.borderColor="var(--b1)";}
  };
  const onEnter = e => {
    if(hover){e.currentTarget.style.borderColor="var(--b2)";}
  };
  return (
    <div ref={ref} style={{...base,position:"relative"}} onMouseMove={onMove} onMouseEnter={onEnter} onMouseLeave={onLeave}>
      {glow && <div className="sp" style={{position:"absolute",inset:0,borderRadius:"inherit",pointerEvents:"none",opacity:0,transition:"opacity 0.3s",background:"radial-gradient(500px circle at var(--mx,50%) var(--my,50%),rgba(16,185,129,0.07),transparent 65%)"}}/>}
      <div style={{position:"relative",zIndex:1}}>{children}</div>
    </div>
  );
}

function Divider({style:s}) {

function SectionLabel({children, style:s}) {

function Sparkline({data, color="#10b981", width=80, height=28}) {
  const min = Math.min(...data), max = Math.max(...data), range = max-min||1;
  const pts = data.map((v,i)=>`${(i/(data.length-1))*width},${height-((v-min)/range)*(height-4)+2}`).join(" ");
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{overflow:"visible"}}>
      <defs>
        <linearGradient id={`sg${color.replace("#","")}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.3"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <polyline points={pts+` ${width},${height} 0,${height}`} fill={`url(#sg${color.replace("#","")})`} stroke="none"/>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx={data.length > 1 ? (((data.length-1)/(data.length-1))*width) : width/2} cy={height-((data[data.length-1]-min)/range)*(height-4)+2} r="2.5" fill={color}/>
    </svg>
  );
}

function BarChart({data, color="#10b981", labels, height=60}) {
  const max = Math.max(...data);
  return (
    <div style={{display:"flex",alignItems:"flex-end",gap:4,height}}>
      {data.map((v,i)=>(
        <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4,height:"100%",justifyContent:"flex-end"}}>
          <div style={{width:"100%",borderRadius:"3px 3px 0 0",background:`${color}cc`,transition:"height 0.4s",height:`${(v/max)*100}%`,minHeight:3,boxShadow:`0 0 8px ${color}40`}}/>
          {labels && <span style={{fontSize:8,color:"var(--t3)",fontFamily:"var(--mono)"}}>{labels[i]}</span>}
        </div>
      ))}
    </div>
  );
}

function ProgressBar({pct, color="#10b981", height=4}) {
  return (
    <div style={{width:"100%",height,borderRadius:height,background:"rgba(255,255,255,0.07)",overflow:"hidden"}}>
      <div style={{width:`${pct}%`,height:"100%",borderRadius:height,background:color,boxShadow:`0 0 8px ${color}60`,transition:"width 0.6s cubic-bezier(0.34,1.56,0.64,1)"}}/>
    </div>
  );
}

function MatchesPage() {
  const [tab, setTab] = React.useState("upcoming");
  return (
    <div>

        <Btn variant="primary" size="sm"><Icon id="matches" size={13}/>Nuevo partido</Btn>
      </TopBar>

        {/* Stats */}
        <div style={{display:"flex",gap:12}}>
          {[
            {label:"Partidos jugados",value:"21",color:"var(--sky)"},
            {label:"Victorias",value:"14",color:"#10b981"},
            {label:"Empates",value:"4",color:"#f59e0b"},
            {label:"Derrotas",value:"3",color:"#f43f5e"},
            {label:"Goles a favor",value:"38",color:"#10b981"},
            {label:"Goles en contra",value:"18",color:"#f43f5e"},
          ].map(s=>(
            <Card key={s.label} style={{flex:1,padding:"14px 16px"}} hover>
              <SectionLabel style={{marginBottom:6}}>{s.label}</SectionLabel>
              <div style={{fontFamily:"var(--mono)",fontSize:26,fontWeight:700,letterSpacing:"-0.03em",color:s.color}}>{s.value}</div>
            </Card>
          ))}
        </div>
        {/* Tabs */}
        <div style={{display:"flex",gap:4,background:"rgba(255,255,255,0.04)",borderRadius:10,padding:4,border:"1px solid var(--b1)",width:"fit-content"}}>
          {["upcoming","played"].map(t=>(
            <div key={t} onClick={()=>setTab(t)}
              style={{padding:"6px 16px",borderRadius:7,fontSize:12,fontWeight:600,cursor:"pointer",transition:"all 0.14s",
                background:tab===t?"#10b981":"transparent",color:tab===t?"#000":"rgba(255,255,255,0.5)",
                boxShadow:tab===t?"0 0 12px rgba(16,185,129,0.35)":"none"}}>
              {t==="upcoming"?"Próximos":"Resultados"}
            </div>
          ))}
        </div>
        <Card>
          {MATCHES.filter(m=>m.status===tab).map(m=>{
            const wfc = m.home==="Deporte FC";
            const ourGoals = wfc?m.homeGoals:m.awayGoals;
            const theirGoals = wfc?m.awayGoals:m.homeGoals;
            const win = m.status==="played"&&ourGoals>theirGoals;
            const draw = m.status==="played"&&ourGoals===theirGoals;
            return (
              <div key={m.id} style={{display:"flex",alignItems:"center",gap:20,padding:"18px 20px",borderBottom:"1px solid rgba(255,255,255,0.06)",transition:"background 0.14s",cursor:"pointer"}}
                onMouseEnter={e=>e.currentTarget.style.background="rgba(255,255,255,0.025)"}
                onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <Badge color={wfc?"#10b981":"#38bdf8"}>{wfc?"LOCAL":"VISIT"}</Badge>
                </div>
                <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"space-between",gap:20}}>
                  <span style={{fontSize:15,fontWeight:700,color:"var(--t1)",minWidth:140,textAlign:"right"}}>{m.home}</span>
                  <div style={{display:"flex",alignItems:"center",gap:10,background:"rgba(255,255,255,0.05)",borderRadius:10,padding:"8px 16px",border:"1px solid var(--b1)"}}>
                    {m.status==="played"
                      ? <span style={{fontFamily:"var(--mono)",fontSize:20,fontWeight:700,letterSpacing:"0.08em",color:win?"#10b981":draw?"#f59e0b":"#f43f5e"}}>{m.result}</span>
                      : <span style={{fontFamily:"var(--mono)",fontSize:14,fontWeight:500,color:"var(--t3)",letterSpacing:"0.08em"}}>vs</span>
                    }
                  </div>
                  <span style={{fontSize:15,fontWeight:700,color:"var(--t1)",minWidth:140}}>{m.away}</span>
                </div>
                <div style={{textAlign:"right",minWidth:120}}>
                  <div style={{fontSize:12,fontWeight:600,color:"var(--t2)"}}>{m.date}</div>
                  <div style={{fontSize:10,color:"var(--t3)",marginTop:2}}>{m.comp}</div>
                </div>
              </div>
            );
          })}
        </Card>
      </div>
    </div>
  );
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#10b981",
  "clubName": "Deporte FC",
  "density": "normal",
  "showRiskBadges": true
}/*EDITMODE-END*/;

function applyTweaks(t) {
  document.documentElement.style.setProperty("--neon", t.accentColor);
  document.documentElement.style.setProperty("--color-neon", t.accentColor);
}

function TweaksPanel({ visible, onClose }) {
  const [tweaks, setTweaks] = React.useState(() => {
    try { return { ...TWEAK_DEFAULTS, ...JSON.parse(localStorage.getItem("dfc-tweaks") || "{}") }; }
    catch { return TWEAK_DEFAULTS; }
  });

  React.useEffect(() => { applyTweaks(tweaks); }, [tweaks]);

  const update = (key, val) => {
    const next = { ...tweaks, [key]: val };
    setTweaks(next);
    localStorage.setItem("dfc-tweaks", JSON.stringify(next));
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: next }, "*");
    applyTweaks(next);
  };

  const ACCENT_PRESETS = [
    { label: "Neon", c: "#10b981" }, { label: "Sky", c: "#38bdf8" },
    { label: "Purple", c: "#8b5cf6" }, { label: "Amber", c: "#f59e0b" },
    { label: "Red", c: "#f43f5e" }, { label: "White", c: "#f1f5f9" },
  ];

  if (!visible) return null;
  return (
    <div style={{position:"fixed",bottom:24,right:24,zIndex:9999,width:280,borderRadius:16,
      background:"rgba(8,15,32,0.97)",border:"1px solid rgba(255,255,255,0.14)",
      boxShadow:"0 8px 48px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.05)",
      backdropFilter:"blur(20px)",overflow:"hidden"}}>
      {/* Header */}
      <div style={{padding:"14px 18px",borderBottom:"1px solid rgba(255,255,255,0.08)",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{width:8,height:8,borderRadius:"50%",background:"var(--neon)",boxShadow:"0 0 8px var(--neon)"}}/>
          <span style={{fontSize:13,fontWeight:700,color:"var(--t1)"}}>Tweaks</span>
        </div>
        <button onClick={onClose} style={{color:"var(--t3)",fontSize:16,transition:"color 0.15s",background:"none",border:"none",cursor:"pointer"}}
          onMouseEnter={e=>e.target.style.color="#f43f5e"} onMouseLeave={e=>e.target.style.color="var(--t3)"}>✕</button>
      </div>

      <div style={{padding:"16px 18px",display:"flex",flexDirection:"column",gap:18}}>
        {/* Accent color */}
        <div>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:"0.12em",textTransform:"uppercase",color:"var(--t3)",marginBottom:10}}>Color de acento</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {ACCENT_PRESETS.map(p => (
              <div key={p.c} onClick={() => update("accentColor", p.c)} title={p.label}
                style={{width:28,height:28,borderRadius:"50%",background:p.c,cursor:"pointer",transition:"transform 0.15s, box-shadow 0.15s",
                  border: tweaks.accentColor===p.c ? "2px solid #fff" : "2px solid transparent",
                  boxShadow: tweaks.accentColor===p.c ? `0 0 12px ${p.c}` : "none"}}
                onMouseEnter={e=>{e.currentTarget.style.transform="scale(1.2)";}}
                onMouseLeave={e=>{e.currentTarget.style.transform="";}}/>
            ))}
          </div>
        </div>

        {/* Club name */}
        <div>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:"0.12em",textTransform:"uppercase",color:"var(--t3)",marginBottom:8}}>Nombre del club</div>
          <input value={tweaks.clubName} onChange={e=>update("clubName",e.target.value)}
            style={{width:"100%",padding:"8px 12px",borderRadius:8,background:"rgba(255,255,255,0.06)",
              border:"1px solid rgba(255,255,255,0.12)",color:"var(--t1)",fontSize:13,
              fontFamily:"var(--font)",outline:"none"}}
            onFocus={e=>{e.target.style.borderColor="rgba(16,185,129,0.4)";}}
            onBlur={e=>{e.target.style.borderColor="rgba(255,255,255,0.12)";}}/>
        </div>

        {/* Density */}
        <div>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:"0.12em",textTransform:"uppercase",color:"var(--t3)",marginBottom:8}}>Densidad de interfaz</div>
          <div style={{display:"flex",gap:4,background:"rgba(255,255,255,0.04)",borderRadius:8,padding:3}}>
            {["compact","normal","comfortable"].map(d=>(
              <div key={d} onClick={()=>update("density",d)}
                style={{flex:1,padding:"5px 8px",borderRadius:6,textAlign:"center",fontSize:11,fontWeight:600,cursor:"pointer",transition:"all 0.14s",
                  background:tweaks.density===d?"rgba(16,185,129,0.15)":"transparent",
                  color:tweaks.density===d?"var(--neon)":"var(--t3)",
                  border:tweaks.density===d?"1px solid rgba(16,185,129,0.3)":"1px solid transparent"}}>
                {d==="compact"?"Compact":d==="normal"?"Normal":"Amplia"}
              </div>
            ))}
          </div>
        </div>

        {/* Risk badges toggle */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div>
            <div style={{fontSize:13,fontWeight:500,color:"var(--t1)"}}>Badges de riesgo</div>
            <div style={{fontSize:11,color:"var(--t3)"}}>Mostrar indicadores ML</div>
          </div>
          <div onClick={()=>update("showRiskBadges",!tweaks.showRiskBadges)}
            style={{width:40,height:22,borderRadius:11,cursor:"pointer",transition:"background 0.2s",position:"relative",
              background:tweaks.showRiskBadges?"var(--neon)":"rgba(255,255,255,0.12)"}}>
            <div style={{position:"absolute",top:3,width:16,height:16,borderRadius:"50%",background:"#fff",transition:"left 0.2s",
              left:tweaks.showRiskBadges?20:3,boxShadow:"0 1px 4px rgba(0,0,0,0.4)"}}/>
          </div>
        </div>

        {/* PDF Export */}
        <div style={{borderTop:"1px solid rgba(255,255,255,0.08)",paddingTop:14}}>
          <button onClick={()=>window.print()}
            style={{width:"100%",padding:"9px 16px",borderRadius:9,background:"rgba(255,255,255,0.05)",
              border:"1px solid rgba(255,255,255,0.12)",color:"var(--t2)",fontSize:12,fontWeight:600,
              fontFamily:"var(--font)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8,transition:"all 0.15s"}}
            onMouseEnter={e=>{e.currentTarget.style.background="rgba(255,255,255,0.09)";e.currentTarget.style.color="#fff";}}
            onMouseLeave={e=>{e.currentTarget.style.background="rgba(255,255,255,0.05)";e.currentTarget.style.color="var(--t2)";}}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            Exportar como PDF
          </button>
        </div>
      </div>
    </div>
  );
}

function AppWithTweaks() {
  const [tweaksVisible, setTweaksVisible] = React.useState(false);

  React.useEffect(() => {
    // Register tweaks mode availability
    window.addEventListener("message", (e) => {
      if (e.data?.type === "__activate_edit_mode")   setTweaksVisible(true);
      if (e.data?.type === "__deactivate_edit_mode") setTweaksVisible(false);
    });
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    // Apply saved tweaks on load
    try {
      const saved = JSON.parse(localStorage.getItem("dfc-tweaks") || "{}");
      applyTweaks({ ...TWEAK_DEFAULTS, ...saved });
    } catch {}
  }, []);

  return (
    <>
      <App />
      <TweaksPanel visible={tweaksVisible} onClose={() => setTweaksVisible(false)} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AppWithTweaks/>);
</script>
</body>
</html>
