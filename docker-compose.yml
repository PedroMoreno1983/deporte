services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deporte_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/deporte_db
      REDIS_URL: redis://redis:6379
      SECRET_KEY: change-me-in-production
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery worker — without this, CV uploads enqueue to Redis but nothing
  # consumes them (the dispatcher only falls back to inline when Redis is
  # *unreachable*; in compose it's reachable). Shares the backend image and the
  # ./backend mount so code changes hot-reload via a container restart.
  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/deporte_db
      REDIS_URL: redis://redis:6379
      SECRET_KEY: change-me-in-production
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    command: celery -A app.worker.celery_app:celery_app worker -Q cv,ml,imports,maintenance,default --concurrency 2 --loglevel info

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
