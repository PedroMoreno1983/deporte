# Deporte FC backend — nginx reverse proxy to the Dockerized API on :8000.
# Coexists with the other Datawise sites on this VPS.
# `certbot --nginx -d deporte-api.datawiseconsultoria.com` adds the TLS (443)
# server block + HTTP->HTTPS redirect automatically.
server {
    listen 80;
    listen [::]:80;
    server_name deporte-api.datawiseconsultoria.com;

    # Allow large match-video uploads (the CV pipeline accepts up to 500 MB).
    client_max_body_size 600M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for the /ws realtime endpoint.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long timeouts for streaming responses / slow CV jobs.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
